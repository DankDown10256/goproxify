name: Build & Push images

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Services à builder (admin core agent landing ou all)"
        required: false
        default: "all"

env:
  REGISTRY: ghcr.io/vincamok/goproxify

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read versions
        id: versions
        run: |
          echo "admin=$(python3 -c "import json; print(json.load(open('versions.json'))['admin'])")"    >> $GITHUB_OUTPUT
          echo "core=$(python3 -c "import json; print(json.load(open('versions.json'))['core'])")"      >> $GITHUB_OUTPUT
          echo "agent=$(python3 -c "import json; print(json.load(open('versions.json'))['agent'])")"    >> $GITHUB_OUTPUT
          echo "landing=$(python3 -c "import json; print(json.load(open('versions.json'))['landing'])")" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      # ── Admin ──────────────────────────────────────────────────────────────
      - name: Build & push admin
        if: ${{ inputs.services == 'all' || inputs.services == 'admin' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/admin/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/admin:${{ steps.versions.outputs.admin }}
            ${{ env.REGISTRY }}/admin:latest
          build-args: |
            VERSION_ADMIN=${{ steps.versions.outputs.admin }}
            VERSION_CORE=${{ steps.versions.outputs.core }}
            VERSION_AGENT=${{ steps.versions.outputs.agent }}
            VERSION_LANDING=${{ steps.versions.outputs.landing }}
            GIT_COMMIT=${{ steps.versions.outputs.commit }}
            BUILD_TIME=${{ steps.versions.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Core ───────────────────────────────────────────────────────────────
      - name: Build & push core
        if: ${{ inputs.services == 'all' || inputs.services == 'core' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/core/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/core:${{ steps.versions.outputs.core }}
            ${{ env.REGISTRY }}/core:latest
          build-args: |
            VERSION_ADMIN=${{ steps.versions.outputs.admin }}
            VERSION_CORE=${{ steps.versions.outputs.core }}
            VERSION_AGENT=${{ steps.versions.outputs.agent }}
            VERSION_LANDING=${{ steps.versions.outputs.landing }}
            GIT_COMMIT=${{ steps.versions.outputs.commit }}
            BUILD_TIME=${{ steps.versions.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Agent ──────────────────────────────────────────────────────────────
      - name: Build & push agent
        if: ${{ inputs.services == 'all' || inputs.services == 'agent' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/agent/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/agent:${{ steps.versions.outputs.agent }}
            ${{ env.REGISTRY }}/agent:latest
          build-args: |
            VERSION_ADMIN=${{ steps.versions.outputs.admin }}
            VERSION_CORE=${{ steps.versions.outputs.core }}
            VERSION_AGENT=${{ steps.versions.outputs.agent }}
            VERSION_LANDING=${{ steps.versions.outputs.landing }}
            GIT_COMMIT=${{ steps.versions.outputs.commit }}
            BUILD_TIME=${{ steps.versions.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Landing ────────────────────────────────────────────────────────────
      - name: Build & push landing
        if: ${{ inputs.services == 'all' || inputs.services == 'landing' }}
        uses: docker/build-push-action@v6
        with:
          context: services/landing
          file: services/landing/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/landing:${{ steps.versions.outputs.landing }}
            ${{ env.REGISTRY }}/landing:latest
          build-args: |
            VERSION_LANDING=${{ steps.versions.outputs.landing }}
            GIT_COMMIT=${{ steps.versions.outputs.commit }}
            BUILD_TIME=${{ steps.versions.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
